[project]
name = "atomcap-backend"
version = "0.1.0"
description = "AtomCAP — 以交付结果对象为中心的一级市场投资多 Agent 系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",   # EmailStr 校验（auth）
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "langgraph>=0.2",
    "openai>=1.50",            # 经 LiteLLM 网关调用，统一 OpenAI 协议
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0.1,<4.1",       # passlib 1.7.x is not compatible with bcrypt 5.x
    "structlog>=24.0",
    "python-multipart>=0.0.9",  # 上传文件型 BP 材料（UploadFile 表单解析）
    "pdfplumber>=0.11",         # PDF BP 文本抽取（Deal Intake 文件型材料解析）
    "python-docx>=1.1",         # Word(.docx) BP 文本抽取
    "openpyxl>=3.1",            # Excel(.xlsx) 项目表文本抽取
    "python-pptx>=0.6.23",      # PPT(.pptx) 文件生成工具
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
