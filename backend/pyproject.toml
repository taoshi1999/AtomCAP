[project]
name = "atomcap-backend"
version = "0.1.0"
description = "AtomCAP — 以交付结果对象为中心的一级市场投资多 Agent 系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",   # EmailStr 校验（auth）
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "langgraph>=0.2",
    "openai>=1.50",            # 经 LiteLLM 网关调用，统一 OpenAI 协议
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
